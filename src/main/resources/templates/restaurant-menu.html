<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${restaurant.restaurantName}">Restaurant menu</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<main class="page">
    <a class="back-link" href="/">Back to restaurants</a>

    <header class="page-header">
        <h1 th:text="${restaurant.restaurantName}">
            Restaurant name
        </h1>

        <p th:text="${restaurant.description}">
            Restaurant description
        </p>
    </header>

    <h2>Menu</h2>

    <div th:if="${menuItems.isEmpty()}" class="card">
        <p>This restaurant has no available menu items.</p>
    </div>

    <section class="menu-list">
        <div class="card" th:each="menuItem : ${menuItems}">
            <img class="menu-item-image"
                 th:src="${menuItem.imageUrl != null and !#strings.isEmpty(menuItem.imageUrl)} ? ${menuItem.imageUrl} : @{/images/menu-placeholder.svg}"
                 th:alt="${menuItem.name} + ' image'">

            <h3 th:text="${menuItem.name}">Menu item name</h3>
            <p th:text="${menuItem.description}">Menu item description</p>
            <p class="price" th:text="${menuItem.price} + ' €'">0.00 €</p>

            <form class="inline-form" th:action="@{/cart/add}" method="post">
                <input type="hidden" name="menuItemId" th:value="${menuItem.id}">

                <label>
                    Quantity:
                    <input type="number" name="quantity" value="1" min="1">
                </label>

                <button class="button" type="submit">Add to cart</button>
            </form>
        </div>
    </section>

    <section class="card cart-panel" th:if="${cart != null and !cart.empty}">
        <h2>Your cart</h2>
        <div class="cart-row" th:each="item : ${cart.items}">
            <p>
                <span th:text="${item.menuItemName}">Item name</span>
                =
                <span th:text="${item.lineTotal}">0</span>
                €
            </p>

            <div class="quantity-controls">
                <form th:action="@{/cart/decrease}" method="post">
                    <input type="hidden" name="menuItemId" th:value="${item.menuItem.id}">
                    <button class="icon-button" type="submit">-</button>
                </form>

                <span th:text="${item.quantity}">1</span>

                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="menuItemId" th:value="${item.menuItem.id}">
                    <input type="hidden" name="quantity" value="1">
                    <button class="icon-button" type="submit">+</button>
                </form>
            </div>
        </div>

        <p class="total">
            Total:
            <span th:text="${cart.total}">0</span>
            €
        </p>

        <div class="actions">
            <form th:action="@{/cart/clear}" method="post">
                <input type="hidden" name="restaurantId" th:value="${restaurant.id}">
                <button class="button secondary-button" type="submit">Clear cart</button>
            </form>

            <form th:action="@{/checkout}" method="get">
                <button class="button" type="submit">Checkout</button>
            </form>
        </div>
    </section>
</main>

</body>
</html>
