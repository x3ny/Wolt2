<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order placed</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<main class="page narrow-page">
    <section class="card">
        <h1>Order placed</h1>

        <p>
            Order ID:
            <span th:text="${foodOrder.id}"></span>

        </p>

        <p>

            Delivery address:
            <span th:text="${foodOrder.deliveryAddress}"></span>

        </p>

        <p>
            Payment method:
            <span th:text="${foodOrder.paymentMethod}"></span>
        </p>

        <p class="total">
            Total:
            <span th:text="${foodOrder.totalPrice}"></span> €
        </p>
    </section>

    <section class="card">
        <h2>Items</h2>

        <div class="summary-row" th:each="item : ${orderItems}">
            <span th:text="${item.menuItemName}">Item name</span>
            <span>
                x
                <span th:text="${item.quantity}">1</span>
                =
                <span th:text="${item.quantity * item.unitPrice}">0</span>
                €
            </span>
        </div>
    </section>
</main>
</body>
</html>
