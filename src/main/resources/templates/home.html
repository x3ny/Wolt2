<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wolt Food Ordering</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="page wide-page">
    <header class="app-header">
        <div>
            <p class="page-kicker">Wolt Food Ordering</p>
            <h1 class="page-title">Restaurants</h1>
            <p class="page-description">Choose a restaurant and order your favorite food.</p>
        </div>

        <div class="header-actions">
            <a th:if="${role == 'CUSTOMER'}" class="button secondary-button" th:href="@{/orders}">
                Order history
            </a>

            <p th:if="${role}" class="role-pill" th:text="'Logged in as: ' + ${role}"></p>
        </div>
    </header>

    <nav class="category-nav" aria-label="Restaurant categories">
        <form th:action="@{/}" method="get">
            <button class="category-button"
                    th:classappend="${selectedCategory == null or #strings.isEmpty(selectedCategory)} ? ' active'"
                    type="submit">
                All
            </button>
        </form>

        <form th:action="@{/}" method="get">
            <input type="hidden" name="category" value="Pizza">
            <button class="category-button"
                    th:classappend="${selectedCategory == 'Pizza'} ? ' active'"
                    type="submit">
                Pizza
            </button>
        </form>

        <form th:action="@{/}" method="get">
            <input type="hidden" name="category" value="Burgers">
            <button class="category-button"
                    th:classappend="${selectedCategory == 'Burgers'} ? ' active'"
                    type="submit">
                Burgers
            </button>
        </form>

        <form th:action="@{/}" method="get">
            <input type="hidden" name="category" value="Sushi">
            <button class="category-button"
                    th:classappend="${selectedCategory == 'Sushi'} ? ' active'"
                    type="submit">
                Sushi
            </button>
        </form>
    </nav>

    <div th:if="${restaurants.isEmpty()}" class="card empty-state">
        <p>No restaurants found.</p>
    </div>

    <section class="restaurant-grid">
        <a class="card restaurant-card" th:each="restaurant : ${restaurants}"
           th:href="@{/restaurants/{id}(id=${restaurant.id})}">
            <img th:src="${restaurant.imageUrl != null && !restaurant.imageUrl.isEmpty()} ? ${restaurant.imageUrl} : '/static/images/menu-placeholder.svg'" 
                 alt="Restaurant image" class="restaurant-image">
            <h2 th:text="${restaurant.restaurantName}">Restaurant name</h2>

            <p class="restaurant-description" th:text="${restaurant.description}">Description</p>
            <p class="muted-text" th:text="${restaurant.address}">Address</p>

            <p class="meta-line">
                Category:
                <span th:text="${restaurant.category}">Category</span>
            </p>

            <div class="card-footer">
                <p class="rating">
                    Rating:
                    <span th:text="${restaurant.rating}">0</span>
                </p>

                <span th:text="${restaurant.open ? 'Open' : 'Closed'}"
                      th:class="${restaurant.open} ? 'status status-open' : 'status status-closed'">
                    Status
                </span>
            </div>
        </a>
    </section>
</main>
</body>
</html>
